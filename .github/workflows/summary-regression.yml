name: Summary gateway regression tests
on:
  push:
    branches: [fix/multimodal-images]
    paths:
      - "main.py"
      - "database.py"
      - "partition_checkpoint.py"
      - "summary_repair.py"
      - "summary_section_edit.py"
      - "tests/**"
      - ".github/workflows/summary-regression.yml"
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile changed Python modules
        run: python -m py_compile main.py database.py partition_checkpoint.py summary_repair.py summary_section_edit.py
      - name: Run all regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
