name: Gateway regression checks

on:
  push:
    branches:
      - fix/multimodal-images
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/gateway_test
      EXPERIENCE_CARD_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/gateway_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Dashboard JavaScript syntax
        run: |
          node --check static/js/dashboard.js
          node --check static/js/legacy-boundary.js
      - name: Compile Python modules
        run: |
          python -m compileall -q .
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
