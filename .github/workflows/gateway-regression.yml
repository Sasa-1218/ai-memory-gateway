name: Gateway regression checks

on:
  push:
    branches:
      - fix/multimodal-images
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python modules
        run: |
          python -m compileall -q .
      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
