name: Integration branch smoke tests

on:
  push:
    branches:
      - feature/pawwake-4.2-integration
      - feature/pawwake-4.2-synced
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile changed core modules
        run: |
          python -m compileall -q main.py database.py experience_cards.py experience_recall.py recall_rerank.py recall_selection.py recall_budget.py memory_provenance.py memory_lineage_query.py summary_section_edit.py
      - name: Check Dashboard JavaScript syntax
        run: node --check static/js/dashboard.js
      - name: Check experience settings controls exist
        run: |
          grep -q 'set-EXPERIENCE_RECALL_ENABLED' templates/dashboard.html
          grep -q 'EXPERIENCE_RECALL_EVERY_ROUNDS' static/js/dashboard.js
      - name: Test existing experience-card validation
        run: python -m unittest discover -s tests -p test_experience_cards.py -v
      - name: Install application requirements for gateway chat-path tests
        run: python -m pip install -r requirements.txt
      - name: Verify experience recall rules
        run: python -m unittest discover -s tests -p test_experience_recall.py -v
      - name: Verify mocked database recall cooldown
        run: python -m unittest discover -s tests -p test_experience_recall_db.py -v
      - name: Verify concise experience-card recall budget
        run: python -m unittest discover -s tests -p test_experience_recall_compact.py -v
      - name: Verify staged rerank selection
        run: python -m unittest discover -s tests -p test_recall_rerank.py -v
      - name: Verify staged shared recall selection
        run: python -m unittest discover -s tests -p test_recall_selection.py -v
      - name: Verify staged memory provenance
        run: python -m unittest discover -s tests -p test_memory_provenance.py -v
      - name: Verify read-only memory ancestry
        run: python -m unittest discover -s tests -p test_memory_lineage_query.py -v
      - name: Verify provenance API and Dashboard wiring
        run: python -m unittest discover -s tests -p test_memory_lineage_wiring.py -v
      - name: Verify shared injection budget and safe default
        run: |
          python -m unittest discover -s tests -p test_recall_budget.py -v
          python -m unittest discover -s tests -p test_recall_budget_wiring.py -v
      - name: Verify gateway basic-chat recall and multimodal handling
        run: python -m unittest discover -s tests -p test_recall_gateway_integration.py -v
      - name: Verify pinned memories and literal proper-noun aliases
        run: python -m unittest discover -s tests -p test_memory_recall_extensions.py -v
      - name: Verify key-gated read-only MCP protocol
        run: |
          python -m unittest discover -s tests -p test_mcp_readonly.py -v
          python -m unittest discover -s tests -p test_mcp_gateway_auth.py -v
